<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Notes Server</title>
</head>
<body>
    <h1>File Notes Server</h1>

    <h2>Submit a note</h2>
    <form action="/notes" method="POST">
        <label for="note">Your note:</label>
        <input type="text" id="note" name="note" required>
        <button type="submit">Save note</button>
    </form>

    <h2>Upload a file</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label for="myFile">Choose a file:</label>
        <input type="file" id="myFile" name="myFile" required>
        <button type="submit">Upload</button>
    </form>

    <h2>Download a file</h2>
    <a href="/download">Download example text file</a>

    <h2>AJAX: Load notes without reloading</h2>
    <button id="loadNotes">Load notes</button>
    <ul id="notesList"></ul>

    <h2>Test routes</h2>
    <p><a href="/hello/Alex">Test route parameter</a></p>
    <p><a href="/search?term=hello">Test query parameter</a></p>
    <p><a href="/test-error">Test custom 500 handler</a></p>
    <p><a href="/does-not-exist">Test custom 404 handler</a></p>

    <script src="/client.js"></script>
</body>
</html>
